<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Портфолио — Веб-приложения, 3D и Python</title><link rel="stylesheet" href="style.css"></head><body><canvas id="matrix-bg"></canvas><div class="container"><header><div class="top-bar"><div class="logo" id="site-logo"></div><div class="social-links" id="social-links"></div></div><h1 id="site-title"></h1><p class="subtitle" id="site-subtitle"></p></header><main class="grid" id="projects-grid"></main></div><script src="projects.js"></script><script>document.getElementById("site-logo").textContent=SITE_CONFIG.logo;document.getElementById("site-title").textContent=SITE_CONFIG.title;document.getElementById("site-subtitle").textContent=SITE_CONFIG.subtitle;const linksBox=document.getElementById("social-links");[{label:"GitHub",url:SITE_CONFIG.githubUrl},{label:"Kwork",url:SITE_CONFIG.kworkUrl}].forEach(item=>{const a=document.createElement("a");a.className="social-btn"+(item.url?"":" disabled");a.textContent=item.url?`${item.label} ↗`:`${item.label} (скоро)`;if(item.url){a.href=item.url;a.target="_blank";a.rel="noopener";}else{a.href="#";a.onclick=e=>e.preventDefault();}linksBox.appendChild(a);});const grid=document.getElementById("projects-grid");PROJECTS.forEach((proj,idx)=>{const card=document.createElement("article");card.className="card";const badgeId=proj.liveApiUrl?`badge-${idx}`:"";const badgeHtml=proj.liveApiUrl?`<span class="live-badge" id="${badgeId}"><span class="dot"></span>API CHECK</span>`:"";const tagsHtml=(proj.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("");card.innerHTML=`<div><div class="card-head"><h2>${proj.title}</h2>${badgeHtml}</div><p>${proj.description}</p></div><div><div class="tags">${tagsHtml}</div><a class="open-btn" href="${proj.url}" target="_blank" rel="noopener">Открыть проект ↗</a></div>`;grid.appendChild(card);if(proj.liveApiUrl){const c=new AbortController();setTimeout(()=>c.abort(),5000);fetch(proj.liveApiUrl,{signal:c.signal}).then(r=>{const el=document.getElementById(badgeId);if(r.ok&&el){el.classList.add("online");el.innerHTML=`<span class="dot"></span>API ONLINE`;}}).catch(()=>{const el=document.getElementById(badgeId);if(el)el.innerHTML=`<span class="dot"></span>API OFFLINE`;});}});const canvas=document.getElementById("matrix-bg"),ctx=canvas.getContext("2d"),chars="0123456789",fontSize=14;let columns=0,drops=[],lastRows=[];function initMatrix(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;columns=Math.floor(canvas.width/fontSize);drops=Array.from({length:columns},()=>Math.random()*-40);lastRows=Array(columns).fill(-1);}initMatrix();window.addEventListener("resize",initMatrix);let lastTime=0;function drawMatrix(time){if(time-lastTime>42){lastTime=time;ctx.fillStyle="rgba(9,9,11,0.08)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.font=`${fontSize}px ui-monospace,SFMono-Regular,Consolas,monospace`;for(let i=0;i<drops.length;i++){const row=Math.floor(drops[i]),y=row*fontSize;if(row>=0&&row!==lastRows[i]){lastRows[i]=row;const d=chars[Math.floor(Math.random()*chars.length)];ctx.fillStyle=Math.random()>0.82?"rgba(228,228,231,0.24)":"rgba(161,161,170,0.11)";ctx.fillText(d,i*fontSize,y);}if(y>canvas.height&&Math.random()>0.975){drops[i]=0;lastRows[i]=-1;}drops[i]+=0.55;}}requestAnimationFrame(drawMatrix);}requestAnimationFrame(drawMatrix);</script></body></html>
